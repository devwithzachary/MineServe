name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  desktop-tests:
    name: Desktop & Core Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run :core:test and :desktop:test
        run: ./gradlew :core:test :desktop:test -PexcludeAndroid=true --no-daemon

  android-compile:
    name: Android Debug Compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Android Debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
