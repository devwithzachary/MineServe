services:
  mineserve:
    build: .
    image: ghcr.io/devwithzachary/mineserve:1.8.0
    container_name: mineserve
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "8081:8081/tcp"
      - "25565:25565/tcp"
      - "25565:25565/udp"
      - "19132:19132/udp"
    volumes:
      - mineserve-data:/data
    environment:
      - TZ=UTC

volumes:
  mineserve-data:
